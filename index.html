<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fmt=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB';
const esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const base=f=>f.name.replace(/\.[^.]+$/,'');
const MIME={jpg:'image/jpeg',png:'image/png',webp:'image/webp'};
const cvs=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const toBlob=(c,t,q)=>new Promise((r,j)=>c.toBlob(b=>b?r(b):j(new Error('Export failed')),t,q));
const loadImg=f=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Cannot read image'));i.src=URL.createObjectURL(f)});
const draw=(img,bg,w=img.naturalWidth,h=img.naturalHeight)=>{const c=cvs(w,h),x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';if(bg){x.fillStyle=bg;x.fillRect(0,0,w,h)}x.drawImage(img,0,0,w,h);return c};
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3600)};
const fld=(l,h,c='')=>`<div class="fld ${c}"><span class="lbl">${l}</span>${h}</div>`;
const WV=/;\s*wv\)/.test(navigator.userAgent);
async function saveFile(blob,name){
  if(WV&&navigator.canShare){
    try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}
    catch(e){if(e.name==='AbortError')return}
  }
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
const DZ='Drop image or click to upload';
const SV='<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
const IE=SV+'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
const ID=SV+'<path d="M3 6h18M8 6V4h8v2m-9 0l1 14h8l1-14"/></svg>';

function noise(d,w,h){
  const st=Math.max(1,Math.ceil(w*h/2e6)),r=w*4,Y=i=>d[i]*.299+d[i+1]*.587+d[i+2]*.114;let sum=0,cnt=0;
  for(let y=1;y<h-1;y+=st)for(let x=1;x<w-1;x++){
    const i=(y*w+x)*4;
    sum+=Math.abs(Y(i-r-4)-2*Y(i-r)+Y(i-r+4)-2*Y(i-4)+4*Y(i)-2*Y(i+4)+Y(i+r-4)-2*Y(i+r)+Y(i+r+4));cnt++;
  }
  return cnt?Math.sqrt(Math.PI/2)*sum/(6*cnt):0;
}
function denoise(id,sg,passes){
  const w=id.width,h=id.height,d=id.data,r=w*4,k=-1/(2*sg*sg),ws=[.6,.8,.6,.8,1,.8,.6,.8,.6];
  for(let p=0;p<passes;p++){
    const o=new Uint8ClampedArray(d);
    for(let y=1;y<h-1;y++)for(let i=y*r+4,e=y*r+r-4;i<e;i+=4){
      let R=0,G=0,B=0,W=0,n=0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const j=i+dy*r+dx*4,a=d[j]-d[i],b=d[j+1]-d[i+1],c=d[j+2]-d[i+2],q=ws[n++]*Math.exp((a*a+b*b+c*c)*k);
        R+=d[j]*q;G+=d[j+1]*q;B+=d[j+2]*q;W+=q;
      }
      o[i]=R/W;o[i+1]=G/W;o[i+2]=B/W;
    }
    d.set(o);
  }
}
const lz=x=>{if(x===0)return 1;if(x<=-3||x>=3)return 0;const a=Math.PI*x;return 3*Math.sin(a)*Math.sin(a/3)/(a*a)};
function lw(ns,nd){
  const sc=nd/ns,I=new Int32Array(nd*6),Wt=new Float32Array(nd*6);
  for(let x=0;x<nd;x++){
    const c=(x+.5)/sc-.5,f=Math.floor(c)-2;let t=0;
    for(let k=0;k<6;k++){const w=lz(c-(f+k));Wt[x*6+k]=w;t+=w;I[x*6+k]=Math.min(ns-1,Math.max(0,f+k))}
    for(let k=0;k<6;k++)Wt[x*6+k]/=t;
  }
  return[I,Wt];
}
async function lanczos(src,tw,th,tick){
  const sw=src.width,sh=src.height,sd=src.data,[ix,wx]=lw(sw,tw),[iy,wy]=lw(sh,th),mid=new Uint8ClampedArray(tw*sh*4),R=tw*4;
  for(let y=0;y<sh;y++){
    const ro=y*sw*4,mo=y*R;
    for(let x=0;x<tw;x++){
      let r=0,g=0,b=0,a=0;const q=x*6;
      for(let k=0;k<6;k++){const j=ro+ix[q+k]*4,w=wx[q+k];r+=sd[j]*w;g+=sd[j+1]*w;b+=sd[j+2]*w;a+=sd[j+3]*w}
      const o=mo+x*4;mid[o]=r;mid[o+1]=g;mid[o+2]=b;mid[o+3]=a;
    }
    if(!(y&31))await tick(y/sh*.5);
  }
  const out=new Uint8ClampedArray(tw*th*4);
  for(let y=0;y<th;y++){
    const q=y*6,o0=iy[q]*R,o1=iy[q+1]*R,o2=iy[q+2]*R,o3=iy[q+3]*R,o4=iy[q+4]*R,o5=iy[q+5]*R,w0=wy[q],w1=wy[q+1],w2=wy[q+2],w3=wy[q+3],w4=wy[q+4],w5=wy[q+5],oo=y*R;
    for(let x=0;x<R;x++)out[oo+x]=mid[o0+x]*w0+mid[o1+x]*w1+mid[o2+x]*w2+mid[o3+x]*w3+mid[o4+x]*w4+mid[o5+x]*w5;
    if(!(y&31))await tick(.5+y/th*.5);
  }
  return out;
}
function bblur(s,w,h,r){
  const t=new Uint8Array(s.length),o=new Uint8Array(s.length),k=2*r+1,cl=(v,m)=>v<0?0:v>m?m:v;
  for(let y=0;y<h;y++){
    const b=y*w;let a=0;for(let i=-r;i<=r;i++)a+=s[b+cl(i,w-1)];
    for(let x=0;x<w;x++){t[b+x]=a/k;a+=s[b+cl(x+r+1,w-1)]-s[b+cl(x-r,w-1)]}
  }
  for(let x=0;x<w;x++){
    let a=0;for(let i=-r;i<=r;i++)a+=t[cl(i,h-1)*w+x];
    for(let y=0;y<h;y++){o[y*w+x]=a/k;a+=t[cl(y+r+1,h-1)*w+x]-t[cl(y-r,h-1)*w+x]}
  }
  return o;
}
function steep(d,w,h,r,k,thr){
  const n=w*h,Y=new Uint8Array(n),a=new Uint8Array(n),b=new Uint8Array(n),mn=new Uint8Array(n),mx=new Uint8Array(n);
  for(let p=0,i=0;p<n;p++,i+=4)Y[p]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8;
  for(let y=0;y<h;y++){
    const o=y*w;
    for(let x=0;x<w;x++){
      let lo=255,hi=0;
      for(let i=Math.max(0,x-r),e=Math.min(w-1,x+r);i<=e;i++){const v=Y[o+i];if(v<lo)lo=v;if(v>hi)hi=v}
      a[o+x]=lo;b[o+x]=hi;
    }
  }
  for(let y=0;y<h;y++){
    const o=y*w;mn.fill(255,o,o+w);mx.fill(0,o,o+w);
    for(let j=Math.max(0,y-r),e=Math.min(h-1,y+r);j<=e;j++){
      const q=j*w;
      for(let x=0;x<w;x++){if(a[q+x]<mn[o+x])mn[o+x]=a[q+x];if(b[q+x]>mx[o+x])mx[o+x]=b[q+x]}
    }
  }
  for(let p=0,i=0;p<n;p++,i+=4){
    const lo=mn[p],rg=mx[p]-lo;if(rg<thr)continue;
    const t=(Y[p]-lo)/rg,q=2*t,u=t<.5?.5*q*q:1-.5*(2-q)*(2-q),e=lo+(t+(u-t)*k)*rg-Y[p];
    d[i]+=e;d[i+1]+=e;d[i+2]+=e;
  }
}
function usm(d,w,h,rad,amt,thr){
  const n=w*h,Y=new Uint8Array(n);
  for(let p=0,i=0;p<n;p++,i+=4)Y[p]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8;
  const B=bblur(bblur(Y,w,h,rad),w,h,rad);
  for(let p=0,i=0;p<n;p++,i+=4){
    const df=Y[p]-B[p],a=Math.abs(df);if(a<=thr)continue;
    let e=Math.min(45,a-thr);e=(df<0?-e:e)*amt;d[i]+=e;d[i+1]+=e;d[i+2]+=e;
  }
}

const RZ={px:.5,py:.5,r0:0};
function resample(img,sx,sy,sw,sh,tw,th){
  let src=img,cx=sx,cy=sy,cw=sw,ch=sh;
  while(cw>tw*2||ch>th*2){
    const nw=Math.max(tw,Math.round(cw/2)),nh=Math.max(th,Math.round(ch/2)),c=cvs(nw,nh),x=c.getContext('2d');
    x.imageSmoothingQuality='high';x.drawImage(src,cx,cy,cw,ch,0,0,nw,nh);
    src=c;cx=cy=0;cw=nw;ch=nh;
  }
  const c=cvs(tw,th),x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(src,cx,cy,cw,ch,0,0,tw,th);
  return c;
}
let bgLib;
const T=[
 {id:'convert',n:'Convert',auto:1,
  ctl:fld('Format',`<select id="convert-o"><option value="jpg">JPG</option><option value="png">PNG</option><option value="webp">WebP</option></select>`),
  async fn(img,f){
    const t=$('#convert-o').value,c=draw(img,t==='jpg'&&'#fff');
    const b=await toBlob(c,MIME[t],.96);
    return{b,w:c.width,h:c.height,name:base(f)+'.'+t};
  }},
 {id:'compress',n:'Compress',auto:1,
  ctl:fld('Quality <b id="compress-v" class="text-indigo-300">70%</b>',`<input id="compress-q" type="range" min="5" max="100" value="70" oninput="$('#compress-v').textContent=this.value+'%'">`,'grow'),
  async fn(img,f){
    const t=f.type==='image/jpeg'?'image/jpeg':'image/webp',c=draw(img,t==='image/jpeg'&&'#fff');
    const b=await toBlob(c,t,$('#compress-q').value/100);
    const d=Math.round((1-b.size/f.size)*100);
    return{b,w:c.width,h:c.height,name:base(f)+'-compressed.'+(t==='image/jpeg'?'jpg':'webp'),note:` · ${d>=0?'−':'+'}${Math.abs(d)}%`};
  }},
 {id:'resize',n:'Resize',auto:1,
  ctl:fld('Width (px)','<input id="resize-w" class="num" type="number" min="1" max="10000" inputmode="numeric" placeholder="px">')
   +'<button id="resize-l" type="button" class="ib lockb" aria-pressed="true" title="Lock ratio" aria-label="Lock ratio"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg></button>'
   +fld('Height (px)','<input id="resize-h" class="num" type="number" min="1" max="10000" inputmode="numeric" placeholder="px">')
   +fld('Mode','<select id="resize-m"><option value="stretch">Stretch</option><option value="crop">Crop</option></select>')
   +'<div id="resize-zf" class="grow" hidden>'+fld('Zoom <b id="resize-zv" class="text-indigo-300">100%</b>','<input id="resize-z" type="range" min="100" max="300" value="100" oninput="$(\'#resize-zv\').textContent=this.value+\'%\'">')+'</div>'
   +'<span id="resize-hint" hidden class="w-full text-xs text-slate-500">Drag the preview to reposition</span>',
  onload(im){
    $('#resize-w').value=im.naturalWidth;$('#resize-h').value=im.naturalHeight;
    RZ.r0=im.naturalWidth/im.naturalHeight;RZ.px=RZ.py=.5;$('#resize-z').value=100;$('#resize-zv').textContent='100%';
  },
  onclear(){$('#resize-w').value=$('#resize-h').value='';RZ.r0=0},
  async fn(img,f){
    const tw=Math.round(+$('#resize-w').value),th=Math.round(+$('#resize-h').value);
    if(!(tw>=1&&th>=1))return null;
    if(tw>10000||th>10000||tw*th>64e6)throw new Error('Maximum size is 10000 px or 64 MP');
    const W=img.naturalWidth,H=img.naturalHeight;let sw=W,sh=H;
    if($('#resize-m').value==='crop'){
      const z=+$('#resize-z').value/100,ta=tw/th;
      if(ta>W/H){sw=W/z;sh=sw/ta}else{sh=H/z;sw=sh*ta}
    }
    Object.assign(RZ,{W,H,sw,sh});
    let c=resample(img,(W-sw)*RZ.px,(H-sh)*RZ.py,sw,sh,tw,th);
    const t=f.type==='image/jpeg'||f.type==='image/webp'?f.type:'image/png',ext={'image/jpeg':'jpg','image/webp':'webp','image/png':'png'}[t];
    if(t==='image/jpeg'){const w=cvs(tw,th),x=w.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,tw,th);x.drawImage(c,0,0);c=w}
    return{b:await toBlob(c,t,.95),w:tw,h:th,name:`${base(f)}-${tw}x${th}.${ext}`};
  }},
 {id:'removebg',n:'Remove Background',btn:'Remove Background',ctl:'',
  async fn(img,f,prog){
    prog(null,'Loading engine');
    bgLib??=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
    const m={};let top=0;
    const out=await bgLib.removeBackground(f,{model:'isnet',output:{format:'image/png',quality:1},
      progress:(k,c,t)=>{if(!t)return;m[k]=c/t;const v=Object.entries(m),fe=v.filter(e=>e[0].startsWith('fetch')).map(e=>e[1]),ce=v.filter(e=>!e[0].startsWith('fetch')).map(e=>e[1]);
        const p=Math.round(55*(fe.length?fe.reduce((a,b)=>a+b)/fe.length:1)+40*Math.min(1,ce.reduce((a,b)=>a+b,0)/4));
        top=Math.max(top,Math.min(p,94));prog(top,top<55?'Downloading model':'Removing background')}});
    prog(96,'Finishing');await nextFrame();
    const W=img.naturalWidth,H=img.naturalHeight,mask=draw(await loadImg(out),null,W,H),c=draw(img);
    const x=c.getContext('2d');x.globalCompositeOperation='destination-in';x.drawImage(mask,0,0);
    return{b:await toBlob(c,'image/png'),w:W,h:H,name:base(f)+'-nobg.png'};
  }},
 {id:'upscale',n:'Upscale',btn:'Upscale',
  ctl:fld('Scale',`<select id="upscale-s"><option value="2">2x</option><option value="3">3x</option><option value="4">4x</option></select>`),
  async fn(img,f,prog){
    let s=+$('#upscale-s').value;const W=img.naturalWidth,H=img.naturalHeight,cap=25e6;
    if(W*H*s*s>cap){s=Math.floor(Math.sqrt(cap/(W*H))*10)/10;if(s<1.1)throw new Error('Image is too large to upscale');toast(`Scale limited to ${s}x`)}
    const tw=Math.round(W*s),th=Math.round(H*s);let last=0;
    const st=async(p,l,force)=>{const n=performance.now();if(force||n-last>60){prog(Math.round(p),l);await nextFrame();last=performance.now()}};
    await st(0,'Analyzing',1);
    const id=draw(img).getContext('2d').getImageData(0,0,W,H),d=id.data,sg=noise(d,W,H);
    if(sg>=2.5){await st(8,'Denoising',1);denoise(id,Math.min(36,Math.max(12,sg*3)),sg>7?2:1)}
    let al=false;for(let i=3;i<d.length;i+=4)if(d[i]<255){al=true;break}
    if(al)for(let i=0;i<d.length;i+=4){const a=d[i+3]/255;d[i]*=a;d[i+1]*=a;d[i+2]*=a}
    const out=await lanczos(id,tw,th,p=>st(15+p*62,'Enlarging'));
    if(al)for(let i=0;i<out.length;i+=4){const a=out[i+3];if(a&&a<255){const k=255/a;out[i]*=k;out[i+1]*=k;out[i+2]*=k}}
    await st(80,'Finishing',1);
    steep(out,tw,th,s>2.5?2:1,Math.min(.7,.35+.1*s),Math.max(14,sg*3));
    await st(90,'Finishing',1);
    usm(out,tw,th,Math.max(1,Math.round(s*.7)),.4+.15*s,3);
    const c=cvs(tw,th);c.getContext('2d').putImageData(new ImageData(out,tw,th),0,0);
    await st(96,'Exporting',1);
    return{b:await toBlob(c,'image/png'),w:tw,h:th,name:`${base(f)}-x${s}.png`};
  }}
];

const box=(id,l,x='')=>`<figure><figcaption class="flex justify-between text-sm mb-2"><span class="font-semibold">${l}</span><span id="${id}-m" class="text-slate-400"></span></figcaption><div class="checker"><img id="${id}" alt="${l}" hidden>${x}</div></figure>`;
const panel=t=>`<section id="p-${t.id}" class="panel" hidden><div class="card p-5 sm:p-6">
 <label class="drop" for="f-${t.id}" id="d-${t.id}"><input id="f-${t.id}" type="file" accept="image/*" hidden><span>Drop image or click to upload</span></label>
 ${t.ctl?`<div class="flex flex-wrap items-end gap-4 mt-5">${t.ctl}</div>`:''}
 <div class="grid sm:grid-cols-2 gap-4 mt-5">${box(t.id+'-a','Original',`<div class="tools" id="${t.id}-a-t" hidden><button class="chip" data-a="edit">${IE}Edit</button><button class="chip d" data-a="del">${ID}Delete</button></div>`)}${box(t.id+'-b','Result','<div class="load" hidden><div class="rw"><svg viewBox="0 0 48 48"><circle class="rt" cx="24" cy="24" r="20"/><circle class="rf" cx="24" cy="24" r="20" pathLength="100"/></svg><b></b></div><span></span></div>')}</div>
 <div class="flex flex-wrap gap-3 mt-5">${t.auto?'':`<button class="btn" id="run-${t.id}" disabled>${t.btn}</button>`}<a class="btn2" id="dl-${t.id}" hidden>Download</a></div>
</div></section>`;

const pdfPanel=`<section id="p-pdf" class="panel" hidden><div class="card p-5 sm:p-6">
 <label class="drop" for="f-pdf" id="d-pdf"><input id="f-pdf" type="file" accept="image/*" multiple hidden><input id="pdf-rep" type="file" accept="image/*" hidden><span>Drop images or click to upload</span></label>
 <ul id="pdf-list" class="grid gap-2 mt-5"></ul>
 <div class="flex flex-wrap items-end gap-4 mt-5">
  ${fld('Page',`<select id="pdf-size"><option value="a4">A4</option><option value="letter">Letter</option><option value="legal">Legal</option><option value="a3">A3</option></select>`)}
  ${fld('Margin',`<select id="pdf-m"><option value="auto">Auto</option><option value="10">10 mm</option><option value="20">20 mm</option><option value="30">30 mm</option></select>`)}
 </div>
 <div id="pdf-prog" hidden class="mt-5"><div class="flex justify-between text-xs text-slate-400 mb-1.5"><span id="pdf-pl"></span><b id="pdf-pv" class="text-indigo-300">0%</b></div><div class="bar"><i id="pdf-pb"></i></div></div>
 <div class="flex flex-wrap gap-3 mt-5"><button class="btn" id="pdf-go" disabled>Create PDF</button><button class="btn2" id="pdf-clear" hidden>Clear</button></div>
</div></section>`;

$('#main').innerHTML=T.map(panel).join('')+pdfPanel;
$('#nav').innerHTML=[...T.map(t=>[t.id,t.n]),['pdf','Image-to-PDF']].map(([i,n])=>`<button role="tab" class="tab" data-t="${i}">${n}</button>`).join('');

const show=id=>{$$('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===id));$$('.panel').forEach(p=>p.hidden=p.id!=='p-'+id)};
$('#nav').onclick=e=>{const b=e.target.closest('.tab');if(b){show(b.dataset.t);b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}};
show('convert');

function dropzone(id,onFiles){
  const d=$('#d-'+id),i=$('#f-'+id);
  i.onchange=()=>{onFiles([...i.files]);i.value=''};
  ['dragenter','dragover'].forEach(v=>d.addEventListener(v,e=>{e.preventDefault();d.classList.add('over')}));
  ['dragleave','drop'].forEach(v=>d.addEventListener(v,e=>{e.preventDefault();d.classList.remove('over')}));
  d.addEventListener('drop',e=>onFiles([...e.dataTransfer.files]));
}

T.forEach(t=>{
  const st={n:0,u:null,img:null,file:null},id=t.id,a=$('#'+id+'-a'),b=$('#'+id+'-b'),ma=$('#'+id+'-a-m'),mb=$('#'+id+'-b-m'),dl=$('#dl-'+id),run=$('#run-'+id);
  const tools=$('#'+id+'-a-t'),load=$('.load',b.closest('figure')),ring=$('.rf',load),pv=$('b',load),pl=$('span',load);
  const setP=(p,l)=>{load.classList.toggle('ind',p==null);if(p==null){ring.style.strokeDashoffset='';pv.textContent=''}else{ring.style.strokeDashoffset=100-p;pv.textContent=p+'%'}pl.textContent=l||'Processing'};
  const go=async()=>{
    if(!st.img)return;const k=++st.n;if(run)run.disabled=true;mb.textContent='';setP(null,'Processing');
    clearTimeout(st.lt);st.lt=setTimeout(()=>load.hidden=false,t.auto?250:0);
    try{
      const r=await t.fn(st.img,st.file,(p,l)=>{if(k===st.n)setP(p,l)});
      if(k!==st.n||!r)return;
      if(st.u)URL.revokeObjectURL(st.u);
      st.u=URL.createObjectURL(r.b);b.src=st.u;b.hidden=false;
      mb.textContent=`${r.w}×${r.h} · ${fmt(r.b.size)}${r.note||''}`;
      dl.href=st.u;dl.download=r.name;dl.hidden=false;
    }catch(e){if(k===st.n){mb.textContent='';toast(e.message||'Something went wrong')}}
    finally{if(k===st.n){clearTimeout(st.lt);load.hidden=true;if(run)run.disabled=false}}
  };
  t.go=go;
  dl.addEventListener('click',async e=>{if(!WV)return;e.preventDefault();try{await saveFile(await (await fetch(dl.href)).blob(),dl.download)}catch(x){toast('Download failed')}});
  dropzone(id,async fs=>{
    const f=fs.find(x=>x.type.startsWith('image/'));if(!f)return toast('Select an image file');
    let im;try{im=await loadImg(f)}catch(e){return toast(e.message)}
    if(st.img)URL.revokeObjectURL(st.img.src);if(st.u){URL.revokeObjectURL(st.u);st.u=null}
    st.img=im;st.file=f;st.n++;clearTimeout(st.lt);load.hidden=true;a.src=im.src;a.hidden=false;tools.hidden=false;b.hidden=true;dl.hidden=true;mb.textContent='';
    ma.textContent=`${st.img.naturalWidth}×${st.img.naturalHeight} · ${fmt(f.size)}`;
    $('#d-'+id+' span').textContent=f.name;
    if(run)run.disabled=false;
    if(t.onload)t.onload(im);
    if(t.auto)go();
  });
  if(run)run.onclick=go;
  tools.onclick=e=>{
    const x=e.target.closest('button');if(!x)return;
    if(x.dataset.a==='edit')return $('#f-'+id).click();
    st.n++;clearTimeout(st.lt);load.hidden=true;
    if(st.img)URL.revokeObjectURL(st.img.src);if(st.u)URL.revokeObjectURL(st.u);
    st.img=st.file=st.u=null;a.hidden=b.hidden=tools.hidden=dl.hidden=true;a.removeAttribute('src');b.removeAttribute('src');
    ma.textContent=mb.textContent='';$('#d-'+id+' span').textContent=DZ;if(run)run.disabled=true;if(t.onclear)t.onclear();
  };
  if(t.auto){let q;$('#p-'+id).addEventListener('input',()=>{clearTimeout(q);q=setTimeout(go,120)})}
});

(()=>{
  const w=$('#resize-w'),h=$('#resize-h'),lk=$('#resize-l'),m=$('#resize-m'),pn=$('#p-resize'),rb=$('#resize-b'),tool=T.find(x=>x.id==='resize');
  const lock=()=>lk.getAttribute('aria-pressed')==='true',cv=v=>Math.min(10000,Math.max(1,Math.round(v))),cl=v=>Math.min(1,Math.max(0,v));
  w.addEventListener('input',()=>{if(lock()&&RZ.r0&&w.value)h.value=cv(+w.value/RZ.r0)});
  h.addEventListener('input',()=>{if(lock()&&RZ.r0&&h.value)w.value=cv(+h.value*RZ.r0)});
  lk.onclick=()=>{const on=!lock();lk.setAttribute('aria-pressed',on);if(on&&RZ.r0&&w.value)h.value=cv(+w.value/RZ.r0);pn.dispatchEvent(new Event('input'))};
  m.addEventListener('input',()=>{const c=m.value==='crop';$('#resize-zf').hidden=!c;$('#resize-hint').hidden=!c;pn.dataset.m=m.value});
  let drag=null,run=0,pend=0;
  const live=async()=>{if(run){pend=1;return}run=1;do{pend=0;await tool.go()}while(pend);run=0};
  rb.draggable=false;
  rb.addEventListener('pointerdown',e=>{if(m.value!=='crop'||rb.hidden)return;drag={x:e.clientX,y:e.clientY};rb.setPointerCapture(e.pointerId);e.preventDefault()});
  rb.addEventListener('pointermove',e=>{
    if(!drag)return;
    const k=RZ.sw/rb.getBoundingClientRect().width,dx=(e.clientX-drag.x)*k,dy=(e.clientY-drag.y)*k;drag={x:e.clientX,y:e.clientY};
    if(RZ.W-RZ.sw>.5)RZ.px=cl(RZ.px-dx/(RZ.W-RZ.sw));
    if(RZ.H-RZ.sh>.5)RZ.py=cl(RZ.py-dy/(RZ.H-RZ.sh));
    live();
  });
  ['pointerup','pointercancel'].forEach(v=>rb.addEventListener(v,()=>drag=null));
})();
const P=[];
const renderPdf=()=>{
  $('#pdf-list').innerHTML=P.map((it,i)=>`<li class="row"><img src="${it.img.src}" alt="" class="w-11 h-11 rounded-lg object-cover"><div class="min-w-0 grow"><p class="truncate text-sm font-medium">${i+1}. ${esc(it.f.name)}</p><p class="text-xs text-slate-400">${it.img.naturalWidth}×${it.img.naturalHeight} · ${fmt(it.f.size)}</p></div><button class="ib" data-a="u" data-i="${i}" aria-label="Move up">↑</button><button class="ib" data-a="d" data-i="${i}" aria-label="Move down">↓</button><button class="ib" data-a="e" data-i="${i}" aria-label="Edit" title="Edit">${IE}</button><button class="ib" data-a="x" data-i="${i}" aria-label="Delete" title="Delete">${ID}</button></li>`).join('');
  $('#pdf-go').disabled=!P.length;$('#pdf-clear').hidden=!P.length;
};
dropzone('pdf',async fs=>{
  for(const f of fs){if(!f.type.startsWith('image/'))continue;try{P.push({f,img:await loadImg(f)})}catch(e){toast(f.name+': cannot read image')}}
  renderPdf();
});
$('#pdf-list').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i,a=b.dataset.a;
  if(a==='e'){$('#pdf-rep').dataset.i=i;return $('#pdf-rep').click()}
  if(a==='x')P.splice(i,1);
  else{const j=a==='u'?i-1:i+1;if(j<0||j>=P.length)return;[P[i],P[j]]=[P[j],P[i]]}
  renderPdf();
};
$('#pdf-clear').onclick=()=>{P.length=0;renderPdf()};
$('#pdf-rep').onchange=async e=>{
  const f=e.target.files[0],i=+e.target.dataset.i;e.target.value='';
  if(!f||!f.type.startsWith('image/'))return;
  try{P[i]={f,img:await loadImg(f)};renderPdf()}catch(x){toast(x.message)}
};
$('#pdf-go').onclick=async()=>{
  const btn=$('#pdf-go'),pg=$('#pdf-prog'),n=P.length;btn.disabled=true;btn.textContent='Creating…';pg.hidden=false;
  const sp=(i,l)=>{const v=Math.round(i/n*100);$('#pdf-pb').style.width=v+'%';$('#pdf-pv').textContent=v+'%';$('#pdf-pl').textContent=l};
  sp(0,'Page 1 of '+n);await nextFrame();
  try{
    const {jsPDF}=window.jspdf,fm=$('#pdf-size').value,mv=$('#pdf-m').value;let doc;
    for(let i=0;i<P.length;i++){
      sp(i,`Page ${i+1} of ${n}`);await nextFrame();
      const im=P[i].img,nw=im.naturalWidth,nh=im.naturalHeight,o=nw>nh?'l':'p';
      if(!doc)doc=new jsPDF({orientation:o,unit:'mm',format:fm});else doc.addPage(fm,o);
      const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
      const m=mv==='auto'?Math.min(W,H)*.07:+mv,r=Math.min((W-2*m)/nw,(H-2*m)/nh),w=nw*r,h=nh*r;
      const k=Math.min(1,3600/Math.max(nw,nh)),c=draw(im,'#fff',Math.round(nw*k),Math.round(nh*k));
      doc.addImage(c.toDataURL('image/jpeg',.92),'JPEG',(W-w)/2,(H-h)/2,w,h,undefined,'FAST');
    }
    sp(n,'Saving');await nextFrame();
    await saveFile(doc.output('blob'),'convertin.pdf');
  }catch(e){toast(e.message||'PDF failed')}
  setTimeout(()=>pg.hidden=true,900);
  btn.textContent='Create PDF';btn.disabled=!P.length;
};
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
